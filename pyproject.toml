[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-mcp"
version = "2.1.0"
description = "The recorder for your AI conversations: byte-exact copies of your Claude Code, Codex and Pi sessions (Claude Code deletes its own after 30 days by default), searchable over MCP with cited-or-abstain recall. Local-only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Mordechai Potash"}]
keywords = ["mcp", "mcp-server", "ai-memory", "recorder", "claude-code", "codex", "duckdb", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# duckdb: >=1.3 for the `lambda x:` syntax (issue #8); <2 caps the major, the same
# shape as mcp<3 after an unbounded mcp>=1.0 crashed every fresh install for three
# weeks (0.4.1, 2026-08-20). The suite also passes on 2.0.0.dev2610011535 today.
dependencies = [
    "mcp>=2,<3",
    "duckdb>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]

[project.scripts]
brain-mcp = "brain_mcp.recorder.cli:main"

[project.urls]
Homepage = "https://github.com/mordechaipotash/brain-mcp"
Documentation = "https://brainmcp.dev"
Repository = "https://github.com/mordechaipotash/brain-mcp"

[tool.setuptools.packages.find]
include = ["brain_mcp*"]
